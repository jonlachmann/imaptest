name: Build + Release (macOS)

# Only runs on demand (manual "Run workflow") or when a version tag is pushed.
# Deliberately NOT triggered by ordinary pushes/PRs.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create a GitHub Release

jobs:
  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout imaptest (this repo)
        uses: actions/checkout@v4

      - name: Checkout dovecot/core (main) - imaptest's dependency
        uses: actions/checkout@v4
        with:
          repository: dovecot/core
          ref: main
          path: core

      - name: Install build dependencies
        run: |
          brew update
          # autotools (keg-only GNU libtool/bison/flex) + the libs imaptest links
          brew install autoconf automake libtool pkg-config bison flex pcre2 lz4 zstd openssl@3

      - name: Build (Dovecot libs -> imaptest -> portable static binary)
        run: bash .github/scripts/build-macos.sh "$PWD/core" "$PWD"

      - name: Smoke test
        run: ./src/imaptest --help >/dev/null && echo "imaptest runs OK"

      - name: Package (rename with version + arch)
        run: cp src/imaptest "src/imaptest-${GITHUB_REF_NAME}-macos-arm64"

      # Manual (non-tag) runs -> just a downloadable artifact.
      - name: Upload artifact (manual builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: imaptest-macos-arm64
          path: src/imaptest
          if-no-files-found: error

      # Tag push -> publish the binary onto a GitHub Release for that tag.
      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: src/imaptest-${{ github.ref_name }}-macos-arm64